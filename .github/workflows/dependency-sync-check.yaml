name: dependency_sync_check

on:
  push:
    branches:
      - chore/template-dependency-update-clean

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: pnpm install --no-frozen-lockfile > .dependency-sync-install.log 2>&1

      - name: Test
        id: test
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: pnpm test > .dependency-sync-test.log 2>&1

      - name: Lint
        id: lint
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: pnpm lint > .dependency-sync-lint.log 2>&1

      - name: Build
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: pnpm build > .dependency-sync-build.log 2>&1

      - name: Write verification result
        if: always()
        run: |
          {
            printf '%s\n' \
              "install=${{ steps.install.outcome }}" \
              "test=${{ steps.test.outcome }}" \
              "lint=${{ steps.lint.outcome }}" \
              "build=${{ steps.build.outcome }}" \
              "node=$(node --version)" \
              "pnpm=$(pnpm --version)"
            for stage in install test lint build; do
              printf '\n=== %s tail ===\n' "$stage"
              tail -n 120 ".dependency-sync-${stage}.log" 2>/dev/null || true
            done
          } > .dependency-sync-result.txt

      - name: Commit verification result
        if: always()
        uses: EndBug/add-and-commit@v9.1.3
        with:
          add: 'pnpm-lock.yaml .dependency-sync-result.txt'
          default_author: github_actions
          message: '[bot] dependency sync verification result'
