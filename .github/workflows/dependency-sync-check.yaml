name: dependency_sync_check

on:
  push:
    branches:
      - chore/template-dependency-update-clean

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: pnpm install --no-frozen-lockfile

      - name: Test
        id: test
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: pnpm test

      - name: Lint
        id: lint
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: pnpm lint

      - name: Build
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: pnpm build

      - name: Write verification result
        if: always()
        run: |
          printf '%s\n' \
            "install=${{ steps.install.outcome }}" \
            "test=${{ steps.test.outcome }}" \
            "lint=${{ steps.lint.outcome }}" \
            "build=${{ steps.build.outcome }}" \
            "node=$(node --version)" \
            "pnpm=$(pnpm --version)" \
            > .dependency-sync-result.txt

      - name: Commit verification result
        if: always()
        uses: EndBug/add-and-commit@v9.1.3
        with:
          add: 'pnpm-lock.yaml .dependency-sync-result.txt'
          default_author: github_actions
          message: '[bot] dependency sync verification result'
