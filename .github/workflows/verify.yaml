name: verify

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PROJECT_DIR: TavernDev/Scripts/project
      TOOLCHAIN_DIR: TavernDev/Toolchain
    steps:
      - name: Checkout CharInfo source
        uses: actions/checkout@v4
        with:
          path: ${{ env.PROJECT_DIR }}

      - name: Checkout shared TavernHelper Toolchain
        uses: actions/checkout@v4
        with:
          repository: uikawinwing/tavern_helper_toolchain
          ref: main
          path: ${{ env.TOOLCHAIN_DIR }}

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install shared Toolchain dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ${{ env.TOOLCHAIN_DIR }}

      - name: Test
        run: npm run test
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Lint
        run: npm run lint
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Build
        run: npm run build
        working-directory: ${{ env.PROJECT_DIR }}
