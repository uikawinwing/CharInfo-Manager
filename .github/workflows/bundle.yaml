name: release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PROJECT_DIR: TavernDev/Scripts/project
      TOOLCHAIN_DIR: TavernDev/Toolchain
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: ${{ env.PROJECT_DIR }}

      - name: Checkout shared TavernHelper Toolchain
        uses: actions/checkout@v4
        with:
          repository: uikawinwing/tavern_helper_toolchain
          ref: main
          path: ${{ env.TOOLCHAIN_DIR }}

      - name: Skip if this source commit is already released
        id: released
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          git fetch --tags
          existing=""
          for tag in $(git tag --list 'v*'); do
            commit=$(git rev-list -n 1 "$tag")
            parent=$(git rev-parse "$commit^" 2>/dev/null || true)
            if [ "$commit" = "$GITHUB_SHA" ] || [ "$parent" = "$GITHUB_SHA" ]; then
              existing="$tag"
              break
            fi
          done
          echo "tag=$existing" >> "$GITHUB_OUTPUT"
          if [ -n "$existing" ]; then
            echo "Source commit already released as $existing; nothing to do."
          fi

      - name: Use Node.js
        if: steps.released.outputs.tag == ''
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        if: steps.released.outputs.tag == ''
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install shared Toolchain dependencies
        if: steps.released.outputs.tag == ''
        run: pnpm install --frozen-lockfile
        working-directory: ${{ env.TOOLCHAIN_DIR }}

      - name: Test
        if: steps.released.outputs.tag == ''
        run: npm run test
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Lint
        if: steps.released.outputs.tag == ''
        run: npm run lint
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Build release dist
        if: steps.released.outputs.tag == ''
        run: npm run build
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Choose next version tag
        if: steps.released.outputs.tag == ''
        id: version
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          latest=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [ -z "$latest" ]; then
            next="v0.0.1"
          else
            version=${latest#v}
            IFS='.' read -r major minor patch <<< "$version"
            next="v${major}.${minor}.$((patch + 1))"
          fi
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "Next release: $next"

      - name: Freeze verified dist in release-only commit
        if: steps.released.outputs.tag == ''
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist
          if git diff --cached --quiet; then
            echo "dist already matches the source commit; no release-only commit is needed."
          else
            git commit -m "[release] $TAG"
          fi

      - name: Create immutable release tag
        if: steps.released.outputs.tag == ''
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
