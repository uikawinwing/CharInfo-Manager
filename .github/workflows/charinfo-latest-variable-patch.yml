name: CharInfo latest variable patch

on:
  push:
    branches:
      - fix/charinfo-latest-variable-import
    paths:
      - .github/workflows/charinfo-latest-variable-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply precise source patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(text: str, old: str, new: str, expected: int = 1) -> str:
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'Expected {expected} occurrence(s), found {count}: {old!r}')
              return text.replace(old, new)

          app_path = Path('src/char_info_viewer/App.vue')
          app = app_path.read_text(encoding='utf-8')
          app = replace_exact(
              app,
              '<button type="button" :disabled="saveBusy" @click="onImportMvu">保存在聊天变量</button>',
              '<button type="button" :disabled="saveBusy" @click="onImportMvu">导入至[最新消息楼层]变量</button>',
          )
          app = replace_exact(
              app,
              '`确定要将角色 "${importData.姓名 || \'未命名角色\'}" 保存在聊天变量吗？\\n如果已存在同名角色，将会覆盖其数据。`',
              '`确定要将角色 "${importData.姓名 || \'未命名角色\'}" 导入至最新消息楼层变量吗？\\n如果已存在同名角色，将会覆盖其数据。`',
          )
          app = replace_exact(
              app,
              'message: `${characterName} 正在保存到聊天变量…`,',
              'message: `${characterName} 正在导入至最新消息楼层变量…`,',
          )
          app = replace_exact(
              app,
              'successMessage: `✓ ${characterName} 已保存到聊天变量。`,',
              'successMessage: `✓ ${characterName} 已导入至最新消息楼层变量。`,',
          )
          app = replace_exact(
              app,
              "await importToMvuVariables(importData, { type: 'message', message_id: props.messageId });",
              "await importToMvuVariables(importData, { type: 'message', message_id: Math.max(0, getLastMessageId()) });",
          )
          app = replace_exact(
              app,
              'message: `✓ ${characterName} 已保存到聊天变量。`,',
              'message: `✓ ${characterName} 已导入至最新消息楼层变量。`,',
          )
          app = replace_exact(
              app,
              "message: `✕ ${err?.message || '保存到聊天变量失败。'}`",
              "message: `✕ ${err?.message || '导入至最新消息楼层变量失败。'}`",
          )
          app_path.write_text(app, encoding='utf-8')

          illustrated_path = Path('src/char_info_viewer/components/illustrated/IllustratedCharacterSheet.vue')
          illustrated = illustrated_path.read_text(encoding='utf-8')
          illustrated = replace_exact(illustrated, '保存在聊天变量', '导入至[最新消息楼层]变量')
          illustrated_path.write_text(illustrated, encoding='utf-8')

          test_path = Path('tests/char_info_viewer/save-actions.test.cjs')
          tests = test_path.read_text(encoding='utf-8')
          tests = replace_exact(
              tests,
              '  assert.match(appSource, /保存在聊天变量/u);\n  assert.match(illustratedSource, /保存在聊天变量/u);',
              "  assert.match(appSource, /导入至\\[最新消息楼层\\]变量/u);\n  assert.match(illustratedSource, /导入至\\[最新消息楼层\\]变量/u);\n  assert.match(appSource, /message_id:\\s*Math\\.max\\(0,\\s*getLastMessageId\\(\\)\\)/u);\n  assert.doesNotMatch(appSource, /message_id:\\s*props\\.messageId/u);",
          )
          test_path.write_text(tests, encoding='utf-8')

          Path('.github/workflows/charinfo-latest-variable-patch.yml').unlink()
          PY

      - name: Validate patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path('src/char_info_viewer/App.vue').read_text(encoding='utf-8')
          illustrated = Path('src/char_info_viewer/components/illustrated/IllustratedCharacterSheet.vue').read_text(encoding='utf-8')
          tests = Path('tests/char_info_viewer/save-actions.test.cjs').read_text(encoding='utf-8')

          assert '导入至[最新消息楼层]变量' in app
          assert '导入至[最新消息楼层]变量' in illustrated
          assert "message_id: Math.max(0, getLastMessageId())" in app
          assert "message_id: props.messageId" not in app
          assert r'/导入至\[最新消息楼层\]变量/u' in tests
          assert r'/message_id:\s*Math\.max\(0,\s*getLastMessageId\(\)\)/u' in tests
          PY
          git diff --check

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/char_info_viewer/App.vue \
                  src/char_info_viewer/components/illustrated/IllustratedCharacterSheet.vue \
                  tests/char_info_viewer/save-actions.test.cjs \
                  .github/workflows/charinfo-latest-variable-patch.yml
          git commit -m "fix: import CharInfo into latest message variables"
          git push origin HEAD:fix/charinfo-latest-variable-import
