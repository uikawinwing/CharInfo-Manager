name: fix-mvu-character-key-order

on:
  push:
    branches:
      - fix/mvu-character-key-order

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply canonical MVU partner order
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          source_path = Path('src/char_info_viewer/services/importService.ts')
          source = source_path.read_text(encoding='utf-8')

          replacement = '''const MVU_PARTNER_KEY_ORDER = [
            '在场',
            '种族',
            '身份',
            '职业',
            '生命层级',
            '性格',
            '喜爱',
            '外貌',
            '着装',
            '等级',
            '属性',
            '生命值',
            '法力值',
            '体力值',
            '状态效果',
            '背包',
            '装备',
            '技能',
            '资产',
            '登神长阶',
            '命定契约',
            '好感度',
            '心里话',
            '背景故事',
          ] as const;

          const MVU_PARTNER_KEY_SET = new Set<string>(MVU_PARTNER_KEY_ORDER);

          function createNewCharacterDefaults(): Record<string, any> {
            return {
              在场: true,
              种族: '未知',
              身份: [],
              职业: [],
              生命层级: '第一层级/普通层级',
              性格: '',
              喜爱: '',
              外貌: '',
              着装: '',
              等级: 1,
              属性: { 力量: 0, 敏捷: 0, 体质: 0, 智力: 0, 精神: 0 },
              生命值: createResourceState(),
              法力值: createResourceState(),
              体力值: createResourceState(),
              状态效果: {},
              背包: {},
              装备: {},
              技能: {},
              资产: {},
              登神长阶: {
                是否开启: false,
                要素: {},
                权能: {},
                法则: {},
                神位: '',
                神国: { 名称: '', 描述: '' },
              },
              命定契约: false,
              好感度: 0,
              心里话: '',
              背景故事: '',
            };
          }

          function orderCharacterSchema(value: Record<string, any>): Record<string, any> {
            const ordered: Record<string, any> = {};

            MVU_PARTNER_KEY_ORDER.forEach(key => {
              ordered[key] = value[key];
            });

            Object.entries(value).forEach(([key, item]) => {
              if (!MVU_PARTNER_KEY_SET.has(key)) ordered[key] = item;
            });

            return ordered;
          }

          function completeCharacterSchema'''

          pattern = re.compile(
              r"function createNewCharacterDefaults\(\): Record<string, any> \{[\s\S]*?\n\}\n\nfunction completeCharacterSchema"
          )
          source, count = pattern.subn(lambda _m: replacement, source, count=1)
          if count != 1:
              raise SystemExit(f'failed to replace character defaults block: {count}')

          old_write = '  currentVars.stat_data.关系列表[charName] = mvuData;'
          new_write = '  currentVars.stat_data.关系列表[charName] = orderCharacterSchema(mvuData);'
          if old_write not in source:
              raise SystemExit('failed to find relationship writeback')
          source = source.replace(old_write, new_write, 1)
          source_path.write_text(source, encoding='utf-8')

          test_path = Path('tests/char_info_viewer/import-service-divinity-laws.test.cjs')
          test_source = test_path.read_text(encoding='utf-8')
          keys = '''const COMPLETE_CHARACTER_KEYS = [
            '在场',
            '种族',
            '身份',
            '职业',
            '生命层级',
            '性格',
            '喜爱',
            '外貌',
            '着装',
            '等级',
            '属性',
            '生命值',
            '法力值',
            '体力值',
            '状态效果',
            '背包',
            '装备',
            '技能',
            '资产',
            '登神长阶',
            '命定契约',
            '好感度',
            '心里话',
            '背景故事',
          ];'''
          test_source, count = re.subn(
              r"const COMPLETE_CHARACTER_KEYS = \[[\s\S]*?\n\];",
              keys,
              test_source,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'failed to replace expected key order: {count}')

          new_char_anchor = '''  COMPLETE_CHARACTER_KEYS.forEach(key => {
            assert.ok(Object.prototype.hasOwnProperty.call(character, key), `missing schema key: ${key}`);
          });'''
          if new_char_anchor not in test_source:
              raise SystemExit('failed to find new-character key assertion')
          test_source = test_source.replace(
              new_char_anchor,
              new_char_anchor + '''
            assert.deepEqual(Object.keys(character), COMPLETE_CHARACTER_KEYS);''',
              1,
          )

          partial_anchor = '''  COMPLETE_CHARACTER_KEYS.forEach(key => {
            assert.ok(Object.prototype.hasOwnProperty.call(character, key), `missing schema key: ${key}`);
          });
          assert.equal(character._保留字段, 'keep');'''
          if partial_anchor not in test_source:
              raise SystemExit('failed to find partial-character assertion')
          test_source = test_source.replace(
              partial_anchor,
              '''  COMPLETE_CHARACTER_KEYS.forEach(key => {
            assert.ok(Object.prototype.hasOwnProperty.call(character, key), `missing schema key: ${key}`);
          });
          assert.deepEqual(Object.keys(character).slice(0, COMPLETE_CHARACTER_KEYS.length), COMPLETE_CHARACTER_KEYS);
          assert.deepEqual(Object.keys(character).slice(COMPLETE_CHARACTER_KEYS.length), ['_保留字段']);
          assert.equal(character._保留字段, 'keep');''',
              1,
          )
          test_path.write_text(test_source, encoding='utf-8')
          PY

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Test and production build
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build

      - name: Commit verified fix and remove temporary workflow
        run: |
          git rm .github/workflows/fix-mvu-character-key-order.yml
          git add src/char_info_viewer/services/importService.ts tests/char_info_viewer/import-service-divinity-laws.test.cjs
          git commit -m "[skip ci] fix: align MVU partner key order"
          git push origin HEAD:fix/mvu-character-key-order
