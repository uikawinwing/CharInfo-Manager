name: remount_branch_build

on:
  push:
    branches:
      - fix/event-driven-charinfo-remount

permissions:
  contents: write

concurrency:
  group: remount-branch-build
  cancel-in-progress: true

jobs:
  verify-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Build test dist
        run: pnpm build

      - name: Remove template example bundles
        shell: bash
        run: rm -rf dist/角色卡示例 dist/脚本示例 dist/流式楼层界面示例 dist/前端界面示例

      - name: Commit test dist to branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist
          if git diff --cached --quiet; then
            echo "dist already matches source"
          else
            git commit -m "[bot] build event-driven remount test dist"
            git push
          fi
