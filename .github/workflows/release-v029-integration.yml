name: release-v0.2.9-integration

on:
  push:
    branches:
      - release/v0.2.9-integration

permissions:
  contents: write

concurrency:
  group: release-v0.2.9-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge current main without dropping tested pre-release changes
        run: |
          git fetch origin main
          git merge origin/main --no-ff -X ours -m "merge: integrate main into v0.2.9 release"

      - name: Reconcile release behavior and regression tests
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_required(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing expected text in {path}: {old[:120]!r}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          # Keep main's intentional manual-import-to-latest behavior after resolving the release merge.
          app = Path('src/char_info_viewer/App.vue')
          text = app.read_text(encoding='utf-8')
          replacements = [
              ('>保存在聊天变量</button>', '>导入至[最新消息楼层]变量</button>'),
              ('保存在聊天变量吗？\\n如果已存在同名角色', '导入至最新消息楼层变量吗？\\n如果已存在同名角色'),
              ('正在保存到聊天变量…', '正在导入至最新消息楼层变量…'),
              ('已保存到聊天变量。', '已导入至最新消息楼层变量。'),
              ('message_id: props.messageId', 'message_id: Math.max(0, getLastMessageId())'),
              ('保存到聊天变量失败。', '导入至最新消息楼层变量失败。'),
          ]
          for old, new in replacements:
              text = text.replace(old, new)
          app.write_text(text, encoding='utf-8')

          illustrated = Path('src/char_info_viewer/components/illustrated/IllustratedCharacterSheet.vue')
          text = illustrated.read_text(encoding='utf-8').replace(
              '>保存在聊天变量</button>',
              '>导入至[最新消息楼层]变量</button>',
          )
          illustrated.write_text(text, encoding='utf-8')

          # PR #12 introduced a runtimeSettings import used by an ESM/ts-node test path.
          replace_required(
              'src/char_info_viewer_runtime/nativeMessageMount.ts',
              "import { readRuntimeSettings } from './runtimeSettings';",
              "import { readRuntimeSettings } from './runtimeSettings.ts';",
          )

          # Gallery Pack v1 now requires the two dedicated thumbnail keys, even when null.
          replace_required(
              'tests/char_info_viewer/gallery-pack-preview-order.test.cjs',
              "    characterName: '预览角色',\n    gallery: [{ title, sources: [source] }],",
              "    characterName: '预览角色',\n    avatarThumbnail: null,\n    libraryThumbnail: null,\n    gallery: [{ title, sources: [source] }],",
          )

          # Whole-message display formatting is now an intentional read-only locator fallback.
          replace_required(
              'tests/char_info_viewer/message-renderer-compatibility.test.mjs',
              "test('message mounting only reads rendered DOM and does not rewrite stored chat text', () => {\n  assert.match(nativeMountSource, /createTreeWalker\\(root, 4\\)/);\n  assert.doesNotMatch(nativeMountSource, /getChatMessages|formatAsDisplayedMessage|setChatMessages|setChatMessage|createChatMessages|deleteChatMessages/);\n});",
              "test('message mounting may read the raw message for display-only location but never rewrites stored chat text', () => {\n  assert.match(nativeMountSource, /createTreeWalker\\(root, 4\\)/);\n  assert.match(nativeMountSource, /getChatMessages\\(messageId\\)/);\n  assert.match(nativeMountSource, /formatAsDisplayedMessage\\(markedMessage/);\n  assert.doesNotMatch(nativeMountSource, /setChatMessages|setChatMessage|createChatMessages|deleteChatMessages/);\n});",
          )

          # Main intentionally changed manual import scope from the card floor to the latest floor.
          variable_test = Path('tests/char_info_viewer/variable-scope-lifecycle.test.mjs')
          text = variable_test.read_text(encoding='utf-8')
          old = "test('手动 MVU 导入写回卡片所属消息楼层而不是 latest', () => {\n  assert.match(\n    appSource,\n    /importToMvuVariables\\([\\s\\S]{0,200}?message_id:\\s*props\\.messageId/,\n  );\n  assert.doesNotMatch(importServiceSource, /message_id:\\s*'latest'/);\n  assert.match(importServiceSource, /message_id:\\s*number/);\n});"
          new = "test('手动 MVU 导入写回最新消息楼层', () => {\n  assert.match(\n    appSource,\n    /importToMvuVariables\\([\\s\\S]{0,240}?message_id:\\s*Math\\.max\\(0, getLastMessageId\\(\\)\\)/,\n  );\n  assert.doesNotMatch(importServiceSource, /message_id:\\s*'latest'/);\n  assert.match(importServiceSource, /message_id:\\s*number/);\n});"
          if old not in text:
              raise SystemExit('variable scope test shape changed unexpectedly')
          variable_test.write_text(text.replace(old, new), encoding='utf-8')

          # Update host-boundary assertions for the same intentional changes from main + PR #11.
          host_test = Path('tests/char_info_viewer/viewer-host-boundary.test.mjs')
          text = host_test.read_text(encoding='utf-8')
          text = text.replace(
              "  assert.match(appSource, /message_id: props\\.messageId/);",
              "  assert.match(appSource, /message_id: Math\\.max\\(0, getLastMessageId\\(\\)\\)/);",
          )
          text = text.replace(
              "  assert.match(nativeMountSource, /findCollapsedTextRange\\(chunks, body\\)/);",
              "  assert.match(nativeMountSource, /getDisplayLocatorCandidates\\(root, card, body\\)/);\n  assert.match(nativeMountSource, /findCollapsedTextRange\\(chunks, candidate\\)/);",
          )
          text = text.replace(
              "  assert.doesNotMatch(nativeMountSource, /root\\.replaceChildren\\(|formatAsDisplayedMessage|buildRawMessageWithCardSlots|injectCardHostsIntoDisplayedHtml/);",
              "  assert.match(nativeMountSource, /formatAsDisplayedMessage\\(markedMessage/);\n  assert.doesNotMatch(nativeMountSource, /root\\.replaceChildren\\(|buildRawMessageWithCardSlots|injectCardHostsIntoDisplayedHtml|setChatMessages|setChatMessage/);",
          )
          host_test.write_text(text, encoding='utf-8')

          final = app.read_text(encoding='utf-8')
          native_final = Path('src/char_info_viewer_runtime/nativeMessageMount.ts').read_text(encoding='utf-8')
          required = [
              (final, '导入至[最新消息楼层]变量'),
              (final, 'message_id: Math.max(0, getLastMessageId())'),
              (final, 'resolveRemoteGalleryConfig'),
              (native_final, "./runtimeSettings.ts"),
              (native_final, 'formatAsDisplayedMessage(markedMessage'),
          ]
          missing = [needle for haystack, needle in required if needle not in haystack]
          if missing:
              raise SystemExit(f'missing required merged behavior: {missing}')
          PY

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Test and production build
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build

      - name: Remove temporary integration workflow and push result
        run: |
          git rm .github/workflows/release-v029-integration.yml
          git add -A
          git commit -m "[skip ci] build: finalize v0.2.9 integration"
          git push origin HEAD:release/v0.2.9-integration
