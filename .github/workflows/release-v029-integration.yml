name: release-v0.2.9-integration

on:
  push:
    branches:
      - release/v0.2.9-integration

permissions:
  contents: write

concurrency:
  group: release-v0.2.9-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge current main without dropping tested pre-release changes
        run: |
          git fetch origin main
          git merge origin/main --no-ff -X ours -m "merge: integrate main into v0.2.9 release"

      - name: Ensure main-only latest-message import fix is present
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('src/char_info_viewer/App.vue')
          text = app.read_text(encoding='utf-8')
          replacements = [
              ('>保存在聊天变量</button>', '>导入至[最新消息楼层]变量</button>'),
              ('保存在聊天变量吗？\\n如果已存在同名角色', '导入至最新消息楼层变量吗？\\n如果已存在同名角色'),
              ('正在保存到聊天变量…', '正在导入至最新消息楼层变量…'),
              ('已保存到聊天变量。', '已导入至最新消息楼层变量。'),
              ('message_id: props.messageId', 'message_id: Math.max(0, getLastMessageId())'),
              ('保存到聊天变量失败。', '导入至最新消息楼层变量失败。'),
          ]
          for old, new in replacements:
              text = text.replace(old, new)
          app.write_text(text, encoding='utf-8')

          illustrated = Path('src/char_info_viewer/components/illustrated/IllustratedCharacterSheet.vue')
          text = illustrated.read_text(encoding='utf-8').replace(
              '>保存在聊天变量</button>',
              '>导入至[最新消息楼层]变量</button>',
          )
          illustrated.write_text(text, encoding='utf-8')

          final = app.read_text(encoding='utf-8')
          required = [
              '导入至[最新消息楼层]变量',
              'message_id: Math.max(0, getLastMessageId())',
              'resolveRemoteGalleryConfig',
          ]
          missing = [item for item in required if item not in final]
          if missing:
              raise SystemExit(f'missing required merged behavior: {missing}')
          PY

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Test and production build
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build

      - name: Remove temporary integration workflow and push result
        run: |
          git rm .github/workflows/release-v029-integration.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No post-merge build changes to commit"
          else
            git commit -m "[skip ci] build: finalize v0.2.9 integration"
          fi
          git push origin HEAD:release/v0.2.9-integration
